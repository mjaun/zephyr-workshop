CONFIG_LOG=y

# USB device stack with a CDC ACM serial port (dfu_uart), enabled at boot
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_MANUFACTURER_STRING="Workshop"
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="Workshop Demo DFU"
CONFIG_USBD_CDC_ACM_LOG_LEVEL_WRN=y
CONFIG_USBD_LOG_LEVEL_WRN=y

# Firmware update over the USB serial port (src/serial_dfu.c):
# write images to slot1 and hand them over to MCUboot
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_CRC=y
CONFIG_REBOOT=y
